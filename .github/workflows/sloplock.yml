name: SlopLock

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Optional dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review dependency additions
        continue-on-error: true
        uses: theinfosecguy/sloplock@v2
        with:
          changed-only: "true"
          comment: "false"
          fail-on: high
