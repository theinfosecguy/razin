name: Synthetic benchmark

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.7.19"

jobs:
  benchmark:
    name: Package-level precision and recall gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run synthetic benchmark gates
        run: >-
          uv run python scripts/evaluate_corpus.py
          --manifest benchmarks/synthetic/manifest.json
          --gates benchmarks/gates/synthetic.json
          --output benchmark-results/synthetic.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark-report
          path: benchmark-results/synthetic.json
          if-no-files-found: error
